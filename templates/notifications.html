{%extends 'base.html'%}{%block title%}Notifications{%endblock%}{%block content%}<div class="page-head"><span class="eyebrow">UPDATES</span><h2 class="fw-bold mt-2">Notifications</h2></div><div class="card soft-card p-4">{%for n in notifications%}<div class="notice">{{n.message}} <small>{{n.created_at.strftime('%d %b %Y, %I:%M %p')}}</small></div>{%else%}<p class="text-muted">You're all caught up.</p>{%endfor%}</div>{%endblock%}
