{%extends 'base.html'%}{%block title%}My Reports{%endblock%}{%block content%}<div class="page-head"><span class="eyebrow">MY ACTIVITY</span><h2 class="fw-bold mt-2">My reports</h2></div><div class="row g-3">{%for r in reports%}<div class="col-md-6 col-lg-4"><div class="card soft-card p-4 h-100"><span class="badge badge-{{r.status|lower}}">{{r.status}}</span><small class="text-muted">{{r.type}}</small><h5 class="mt-3">{{r.item_name}}</h5><p class="text-muted">{{r.description[:130]}}</p><small>{{r.location}} · {{r.date.strftime('%d %b %Y')}}</small><a class="btn btn-soft mt-3" href="{{url_for('report_detail',rid=r.id)}}">View details</a></div></div>{%else%}<div class="empty">No reports yet.</div>{%endfor%}</div>{%endblock%}
